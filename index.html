<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>T3x Dominion | Presented by Futuret3Ch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05070a;
      color: #e8f4ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui { position: absolute; inset: 0; pointer-events: none; }
    #ui * { pointer-events: auto; }
    .panel {
      background: rgba(8, 14, 28, 0.82);
      border: 1px solid rgba(0, 220, 255, 0.45);
      border-radius: 12px;
      padding: 10px 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    #hud {
      position: absolute;
      top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; flex-wrap: wrap;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    #log {
      position: absolute;
      bottom: 120px; left: 10px;
      width: min(320px, 70vw);
      max-height: 100px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.35;
    }
    #actions {
      position: absolute;
      bottom: 10px; left: 10px; right: 10px;
      display: flex; flex-wrap: wrap; gap: 6px;
      justify-content: center;
    }
    button {
      background: linear-gradient(135deg, #00d4ff, #0099ff);
      border: none;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 180, 255, 0.35);
      flex: 1 1 auto;
      min-width: 140px;
    }
    button:active { transform: scale(0.98); }
    #trailer {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
      text-align: center;
      padding: 20px;
    }
    #trailer.hidden { opacity: 0; pointer-events: none; }
    .logo {
      font-size: clamp(36px, 10vw, 72px);
      font-weight: 900;
      background: linear-gradient(90deg, #00f0ff, #b56cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
    }
    .subtitle { font-size: clamp(16px, 4vw, 22px); color: #aab; margin-bottom: 24px; }
    .presented { font-size: clamp(12px, 3vw, 16px); color: #00e5ff; letter-spacing: 2px; text-transform: uppercase; }
    @media (max-width: 600px) {
      #log { bottom: 140px; }
      button { min-width: 120px; padding: 12px 10px; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="trailer">
    <div class="logo">T3X DOMINION</div>
    <div class="subtitle">Conquer the Grid. Master the Future.</div>
    <div class="presented">Presented by Futuret3Ch & the T3x Ecosystem</div>
    <div style="margin-top: 32px; font-size: 13px; color: #556;">Tap or press any key to begin</div>
  </div>
  <div id="ui">
    <div id="hud" class="panel">
      <div>Energy <span id="energy">120</span></div>
      <div>Data <span id="data">45</span></div>
      <div>Turn <span id="turn">1</span></div>
      <div>Territory <span id="territory">3</span></div>
    </div>
    <div id="log" class="panel"></div>
    <div id="actions">
      <button onclick="endTurn()">End Turn</button>
      <button onclick="spawnUnit('scout')">Scout (20E)</button>
      <button onclick="spawnUnit('defender')">Defender (35E)</button>
      <button onclick="spawnUnit('attacker')">Attacker (50E)</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, hexSize = 32;
    const MAP_RADIUS = 8;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      const maxDim = Math.min(width, height) * 0.72;
      const approxDiameter = (MAP_RADIUS * 2 + 1) * 1.8;
      hexSize = Math.max(18, Math.min(48, maxDim / approxDiameter));
    }
    window.addEventListener('resize', resize);
    resize();

    function hexToPixel(q, r) {
      const x = hexSize * (Math.sqrt(3) * q + Math.sqrt(3)/2 * r) + width / 2;
      const y = hexSize * (3/2 * r) + height / 2;
      return { x, y };
    }

    function pixelToHex(x, y) {
      const q = (Math.sqrt(3)/3 * (x - width/2) - 1/3 * (y - height/2)) / hexSize;
      const r = (2/3 * (y - height/2)) / hexSize;
      return axialRound(q, r);
    }

    function axialRound(q, r) {
      let x = q, z = r, y = -x - z;
      let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
      const xd = Math.abs(rx - x), yd = Math.abs(ry - y), zd = Math.abs(rz - z);
      if (xd > yd && xd > zd) rx = -ry - rz;
      else if (yd > zd) ry = -rx - rz;
      else rz = -rx - ry;
      return { q: rx, r: rz };
    }

    function drawHex(x, y, size, fill, stroke, glow = 0) {
      ctx.save();
      if (glow > 0) {
        ctx.shadowColor = stroke;
        ctx.shadowBlur = glow;
      }
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = Math.PI / 3 * i - Math.PI / 6;
        const hx = x + size * Math.cos(angle);
        const hy = y + size * Math.sin(angle);
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = Math.max(1.5, size * 0.06);
      ctx.stroke();
      ctx.restore();
    }

    const map = {};
    const units = [];
    let selected = null;
    let turn = 1;
    let energy = 120;
    let data = 45;
    let playerTerritory = 0;

    function initMap() {
      for (let q = -MAP_RADIUS; q <= MAP_RADIUS; q++) {
        for (let r = -MAP_RADIUS; r <= MAP_RADIUS; r++) {
          if (Math.abs(q + r) <= MAP_RADIUS) {
            const key = `${q},${r}`;
            const dist = Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r));
            map[key] = {
              q, r,
              owner: dist < 2 ? 'player' : (Math.random() > 0.75 ? 'neutral' : null),
              type: Math.random() > 0.82 ? 'resource' : 'plain',
              unit: null
            };
            if (map[key].owner === 'player') playerTerritory++;
          }
        }
      }
      spawnUnitAt('scout', 0, 0, 'player');
      spawnUnitAt('defender', 1, 0, 'player');
    }

    function spawnUnitAt(type, q, r, owner) {
      const key = `${q},${r}`;
      if (!map[key]) return;
      const unit = { type, q, r, owner, hp: type === 'attacker' ? 80 : type === 'defender' ? 120 : 60 };
      units.push(unit);
      map[key].unit = unit;
    }

    function log(msg) {
      const el = document.getElementById('log');
      el.innerHTML = `<div>${msg}</div>` + el.innerHTML;
    }

    function updateHUD() {
      document.getElementById('energy').textContent = energy;
      document.getElementById('data').textContent = data;
      document.getElementById('turn').textContent = turn;
      document.getElementById('territory').textContent = playerTerritory;
    }

    function spawnUnit(type) {
      const costs = { scout: 20, defender: 35, attacker: 50 };
      if (energy < costs[type]) return log('Not enough Energy');
      for (const key in map) {
        const tile = map[key];
        if (tile.owner === 'player' && !tile.unit) {
          energy -= costs[type];
          spawnUnitAt(type, tile.q, tile.r, 'player');
          log(`Deployed ${type}`);
          updateHUD();
          return;
        }
      }
      log('No free territory');
    }

    function endTurn() {
      turn++;
      energy += 30 + Math.floor(playerTerritory / 2);
      data += 5;
      aiTurn();
      log(`Turn ${turn} begins. +Energy`);
      updateHUD();
    }

    function aiTurn() {
      const neutrals = Object.values(map).filter(t => !t.owner && Math.random() > 0.55);
      if (neutrals.length) neutrals[0].owner = 'ai';
    }

    function render() {
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, width, height);

      const g = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height) * 0.6);
      g.addColorStop(0, 'rgba(0, 80, 120, 0.15)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);

      for (const key in map) {
        const tile = map[key];
        const { x, y } = hexToPixel(tile.q, tile.r);
        let fill = '#0e1624';
        let stroke = 'rgba(0, 180, 220, 0.4)';
        let glow = 0;

        if (tile.owner === 'player') {
          fill = '#0a3a4a';
          stroke = '#00e5ff';
          glow = Math.min(14, hexSize * 0.3);
        } else if (tile.owner === 'ai') {
          fill = '#3a0a1a';
          stroke = '#ff4466';
          glow = Math.min(12, hexSize * 0.28);
        } else if (tile.type === 'resource') {
          fill = '#1a1438';
          stroke = '#aa66ff';
          glow = Math.min(10, hexSize * 0.25);
        }

        if (selected && selected.q === tile.q && selected.r === tile.r) {
          stroke = '#ffffff';
          glow = Math.min(20, hexSize * 0.45);
        }

        drawHex(x, y, hexSize * 0.92, fill, stroke, glow);
      }

      units.forEach(u => {
        const { x, y } = hexToPixel(u.q, u.r);
        const r = hexSize * 0.38;
        ctx.save();
        ctx.shadowColor = u.owner === 'player' ? '#00ffaa' : '#ff5555';
        ctx.shadowBlur = Math.min(16, hexSize * 0.4);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = u.owner === 'player' ? '#00ffaa' : '#ff5555';
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#000';
        ctx.font = `bold ${Math.max(10, hexSize * 0.32)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(u.type[0].toUpperCase(), x, y);
      });

      requestAnimationFrame(render);
    }

    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const hex = pixelToHex(e.clientX - rect.left, e.clientY - rect.top);
      const key = `${hex.q},${hex.r}`;
      const tile = map[key];
      if (!tile) return;

      if (tile.unit && tile.unit.owner === 'player') {
        selected = tile.unit;
        log(`Selected ${tile.unit.type}`);
      } else if (selected) {
        const dist = Math.max(
          Math.abs(hex.q - selected.q),
          Math.abs(hex.r - selected.r),
          Math.abs(hex.q + hex.r - selected.q - selected.r)
        );
        if (dist === 1 && !tile.unit) {
          map[`${selected.q},${selected.r}`].unit = null;
          selected.q = hex.q;
          selected.r = hex.r;
          tile.unit = selected;
          if (!tile.owner) {
            tile.owner = 'player';
            playerTerritory++;
            log('Territory captured');
          }
          selected = null;
          updateHUD();
        }
      }
    });

    const trailer = document.getElementById('trailer');
    function startGame() {
      trailer.classList.add('hidden');
      setTimeout(() => trailer.style.display = 'none', 800);
      initMap();
      updateHUD();
      log('Welcome to T3x Dominion.');
      render();
    }
    trailer.addEventListener('click', startGame);
    window.addEventListener('keydown', startGame);
    setTimeout(() => {
      if (!trailer.classList.contains('hidden')) startGame();
    }, 6000);
  </script>
</body>
</html>
